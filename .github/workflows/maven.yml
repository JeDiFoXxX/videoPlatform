# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      env:
        SERVER_PORT: 8080
        DB_URL: jdbc:postgresql://localhost:5432/fake_db
        DB_USERNAME: postgres
        DB_PASSWORD: password
        KEYCLOAK_BASE_URI: http://localhost:8080
        KEYCLOAK_CLIENT_ID: random-client
        KEYCLOAK_CLIENT_SECRET: super-secret-key
        JWT_ISSUER_URI: http://localhost:8080/realms/videoplatform
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        SIGNALING_SERVICE_URI: http://localhost:8080
        BOOKING_SERVICE_URI: http://localhost:8080
        BOT_SERVICE_URI: http://localhost:8080
        NOTIFICATION_SERVICE_URI: http://localhost:8080
        TELEGRAM_WEBHOOK_SECRET_TOKEN: telegram-secret-token
        GATEWAY_RATE_LIMIT_CAPACITY: 60
        GATEWAY_RATE_LIMIT_REFILL_PER_MINUTE: 60
        GATEWAY_CONNECT_TIMEOUT: 5000
        GATEWAY_RESPONSE_TIMEOUT: 5000
