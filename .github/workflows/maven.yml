# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      env:
        SERVER_PORT: 1111
        BOOKING_DB_URL: jdbc:postgresql://localhost:5432/booking_fake_db
        BOOKING_DB_USERNAME: postgres
        BOOKING_DB_PASSWORD: password
        NOTIFICATION_DB_URL: jdbc:postgresql://localhost:5432/notification_fake_db
        NOTIFICATION_DB_USERNAME: postgres
        NOTIFICATION_DB_PASSWORD: password
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        KEYCLOAK_BASE_URI: http://localhost:1111
        KEYCLOAK_CLIENT_ID: random-client
        KEYCLOAK_CLIENT_SECRET: super-secret-key
        JWT_ISSUER_URI: http://localhost:1111/realms/videoplatform
        SIGNALING_SERVICE_URI: http://localhost:1111
        BOOKING_SERVICE_URI: http://localhost:1111
        BOT_SERVICE_URI: http://localhost:1111
        NOTIFICATION_SERVICE_URI: http://localhost:1111
        TELEGRAM_SECRET_TOKEN: telegram-secret-token
        TELEGRAM_BOT_TOKEN: telegram-bot-token
        GATEWAY_RATE_LIMIT_CAPACITY: 60
        GATEWAY_RATE_LIMIT_REFILL_PER_MINUTE: 60
        GATEWAY_CONNECT_TIMEOUT: 5000
        GATEWAY_RESPONSE_TIMEOUT: 5000
