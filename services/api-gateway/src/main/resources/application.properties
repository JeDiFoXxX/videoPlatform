spring.application.name=api-gateway
server.port=${SERVER_PORT}

telegram.webhook.secret-token=${TELEGRAM_WEBHOOK_SECRET_TOKEN}
telegram.webhook.tg-id-pattern=${TELEGRAM_TG_ID_PATTERN}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
services.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
services.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

gateway.rate-limit.capacity=${GATEWAY_RATE_LIMIT_CAPACITY}
gateway.rate-limit.refill-per-minute=${GATEWAY_RATE_LIMIT_REFILL_PER_MINUTE}

spring.cloud.gateway.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT}
spring.cloud.gateway.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT}

services.signaling-service.uri=${SIGNALING_SERVICE_URI}
services.booking-service.uri=${BOOKING_SERVICE_URI}
services.bot-service.uri=${BOT_SERVICE_URI}